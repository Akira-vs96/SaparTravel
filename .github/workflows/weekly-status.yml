name: Weekly status draft

on:
  schedule:
    - cron: '0 10 * * 5'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  actions: read
  deployments: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read repository facts
        env:
          GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
        run: |
          if [ -n "$GH_PROJECT_TOKEN" ]; then
            export GH_TOKEN="$GH_PROJECT_TOKEN"
            python -m scripts.course.github_facts --repo "$GITHUB_REPOSITORY" --output test-results/weekly/github.json
          else
            python -m scripts.course.github_facts --repo "$GITHUB_REPOSITORY" --skip-project --output test-results/weekly/github.json
          fi
      - name: Generate a file for human review; never post it to issues or mail
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          import json
          from scripts.course.weekly_status import build
          today = datetime.now(timezone.utc).replace(hour=0, minute=0, second=0, microsecond=0)
          end = today - timedelta(days=today.weekday())
          build(json.loads(Path('test-results/weekly/github.json').read_text()), end-timedelta(days=7), end, Path('test-results/weekly/draft'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-status-draft
          path: test-results/weekly/
