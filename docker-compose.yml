services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sapartravel
      POSTGRES_USER: sapar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/setup_env.py first}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sapar -d sapartravel"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: ${SUPABASE_DATABASE_URL:-postgresql+psycopg://sapar:${POSTGRES_PASSWORD:?Run python3 scripts/setup_env.py first}@db:5432/sapartravel}
      JWT_SECRET: ${JWT_SECRET:?Run python3 scripts/setup_env.py first}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:80"
    restart: unless-stopped

volumes:
  postgres_data:
